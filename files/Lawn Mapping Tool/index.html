<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Patch — Backyard Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<style>
  :root {
    --font-sans: 'Outfit', system-ui, -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
    --font-serif: 'Instrument Serif', Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; font-family: var(--font-sans); background: #FBF9F4; color: #2A2E25; }
  #root { height: 100vh; }
  button { font-family: var(--font-sans); }
  input, select, textarea { font-family: var(--font-sans); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #d8d2c1; border-radius: 6px; }
  ::-webkit-scrollbar-thumb:hover { background: #b8b1a0; }
  body.dark ::-webkit-scrollbar-thumb { background: #404439; }
  body.dark ::-webkit-scrollbar-thumb:hover { background: #5a5e51; }
  /* Mobile: lock the layout to the viewport, no rubber-band scrolling */
  @media (max-width: 768px) {
    html, body { overscroll-behavior: none; touch-action: manipulation; }
  }
  canvas { touch-action: none; }
  kbd {
    font-family: var(--font-mono); font-size: 10.5px; padding: 1px 5px;
    background: #E5DFD0; color: #2A2E25; border-radius: 4px;
    border: 1px solid #d6cfbb; border-bottom-width: 2px;
  }
  input[type="range"] { accent-color: #5A8C3F; }
  input[type="number"]::-webkit-inner-spin-button { opacity: .6; }
  .leaf-bg {
    background-image:
      radial-gradient(at 8% 12%, rgba(123, 181, 84, 0.06) 0px, transparent 50%),
      radial-gradient(at 92% 88%, rgba(199, 110, 61, 0.05) 0px, transparent 50%);
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="src/core.jsx"></script>
<script type="text/babel" src="src/ui.jsx"></script>
<script type="text/babel" src="src/modals.jsx"></script>
<script type="text/babel" src="src/app.jsx"></script>
<script type="text/babel" src="src/start.jsx"></script>
</body>
</html>
