<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Food Fight | Daniel Thomas</title>

  <link rel="stylesheet" href="../../styles.css" />
  <link rel="shortcut icon" href="TemplateData/favicon.ico" />
  <link rel="stylesheet" href="TemplateData/style.css" />
  <script src="TemplateData/UnityProgress.js"></script>
  <script src="Build/UnityLoader.js"></script>
  <script>
    var gameInstance = UnityLoader.instantiate(
      "gameContainer",
      "Build/Food Fight Game.json",
      { onProgress: UnityProgress }
    );
  </script>
</head>

<body class="dark-bg">

  <!-- NAV -->
  <header>
    <nav class="nav">
      <div class="nav-left">
        <div class="nav-title">
          <div class="nav-title-main">Daniel Thomas</div>
          <div class="nav-title-sub">Games</div>
        </div>
      </div>
      <div class="nav-links">
        <a href="../../index.html">Home</a>
        <a href="../../about.html">About</a>
        <a href="../../projects.html">Projects</a>
        <a href="../../resume.html">Resume</a>
        <a href="../games.html" class="active">Games</a>
        <a href="../../contact.html">Contact</a>
      </div>
    </nav>
  </header>

  <!-- HERO SECTION -->
  <main>
    <section class="hero shell-xl">
      <div class="accent-tag">GAMES • UNITY • WEBGL</div>

      <h1 class="hero-title">Food Fight</h1>

      <p class="hero-subtitle">
        A Unity WebGL game built by Daniel Thomas.
      </p>
    </section>

    <!-- GAME SECTION -->
    <section class="shell-xl" style="margin-top: 3rem;">
      <div class="game-container-outer">
        <div class="game-container-inner">
          <div id="gameContainer" style="width: 889px; height: 500px;"></div>
        </div>
      </div>

      <div class="unity-footer">
        <div class="unity-footer-left">
          <span class="unity-footer-title">Food Fight</span>
          <span class="unity-footer-authors">Created by: Daniel Thomas</span>
        </div>
        <button class="unity-fullscreen-btn" onclick="gameInstance.SetFullscreen(1)">
          Go Fullscreen
        </button>
      </div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer>
    <div class="footer-inner">
      <span>© <span id="year"></span> Daniel Thomas.</span>
    </div>
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>

  <style>
    /* Match your new dark theme layout */
    .game-container-outer {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 2rem;
      margin-bottom: 2rem;
    }

    .game-container-inner {
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.6);
      background: #000;
    }

    .unity-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 1rem;
      opacity: 0.85;
    }

    .unity-footer-title {
      font-weight: 600;
    }

    .unity-fullscreen-btn {
      cursor: pointer;
      padding: 0.4rem 0.9rem;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.05);
      transition: 0.2s ease;
    }

    .unity-fullscreen-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.5);
    }
  </style>

</body>
</html>
