<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShapeQuest | Daniel Thomas</title>

  <link rel="stylesheet" href="../../styles.css" />
  <link rel="shortcut icon" href="TemplateData/favicon.ico" />
  <link rel="stylesheet" href="TemplateData/style.css" />
  <script src="TemplateData/UnityProgress.js"></script>
  <script src="Build/UnityLoader.js"></script>

  <script>
    var gameInstance = UnityLoader.instantiate(
      "gameContainer",
      "Build/Desktop.json",
      { onProgress: UnityProgress }
    );
  </script>

  <style>
    .hero {
      grid-template-columns: minmax(0, 1fr) !important;
      text-align: center;
      justify-items: center;
    }

    .game-container-outer {
      display: flex;
      justify-content: center;
      margin: 2rem 0;
    }
    .game-container-inner {
      border-radius: 18px;
      overflow: hidden;
      background: #000;
      box-shadow: var(--shadow-soft);
    }
    .unity-footer {
      display: flex;
      justify-content: space-between;
      margin-top: 1rem;
      opacity: 0.85;
      font-size: 0.85rem;
    }
    .unity-fullscreen-btn {
      cursor: pointer;
      padding: 0.45rem 0.9rem;
      border-radius: var(--radius-pill);
      border: 1px solid rgba(148,163,184,0.5);
      background: radial-gradient(circle at top left, rgba(56,189,248,0.18), rgba(15,23,42,0.9));
      color: #e5e7eb;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }
  </style>
</head>

<body>

  <!-- NAV -->
  <header>
    <nav class="nav">
      <div class="nav-left hero--single">
        <div class="nav-title">
          <div class="nav-title-main">Daniel Thomas</div>
          <div class="nav-title-sub">Games</div>
        </div>
      </div>

      <div class="nav-links">
        <a href="../../index.html">Home</a>
        <a href="../../about.html">About</a>
        <a href="../../projects.html">Projects</a>
        <a href="../../resume.html">Resume</a>
        <a href="../games.html" class="active">Games</a>
        <a href="../../contact.html">Contact</a>
      </div>
      <button class="nav-hamburger" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </nav>
  </header>
    <div class="nav-mobile-menu" aria-hidden="true">
      <a href="../../index.html">Home</a>
      <a href="../../about.html">About</a>
      <a href="../../projects.html">Projects</a>
      <a href="../../resume.html">Resume</a>
      <a href="../games.html" class="active">Games</a>
      <a href="../../contact.html">Contact</a>
    </div>

  <main>

    <!-- HERO -->
    <section class="hero shell">
      <div class="hero-left">
        <div class="eyebrow">
          <div class="eyebrow-dot"></div>
          GAMES • UNITY • WEBGL
        </div>

        <h1 class="hero-title"><span>ShapeQuest</span></h1>

        <p class="hero-subtitle">
          A Unity WebGL game built by Daniel Thomas.
        </p>
      </div>
    </section>

    <!-- GAME -->
    <section class="shell">
      <div class="game-container-outer">
        <div class="game-container-inner">
          <div id="gameContainer" style="width: 800px; height: 500px;"></div>
        </div>
      </div>

      <div class="unity-footer">
        <div>
          <span class="unity-footer-title">ShapeQuest</span>
          <span class="unity-footer-authors">Created by: Daniel Thomas</span>
        </div>

        <button class="unity-fullscreen-btn" onclick="gameInstance.SetFullscreen(1)">
          Fullscreen
        </button>
      </div>
    </section>

  </main>

  <!-- FOOTER -->
  <footer>
    <div class="footer-inner">
      <span>© <span id="year"></span> Daniel Thomas.</span>
      <div class="footer-links">
        <a href="../../index.html">Home</a>
        <a href="../../contact.html">Contact</a>
      </div>
    </div>
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    // Hamburger
    const btn = document.querySelector('.nav-hamburger');
    const menu = document.querySelector('.nav-mobile-menu');
    btn.addEventListener('click', () => {
      const open = btn.getAttribute('aria-expanded') === 'true';
      btn.setAttribute('aria-expanded', !open);
      menu.setAttribute('aria-hidden', open);
      btn.classList.toggle('is-open', !open);
      menu.classList.toggle('is-open', !open);
    });
  </script>

</body>
</html>
